<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Swarm</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#0e131b;color:#edf2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#243447,#0e131b 65%)}main{width:min(650px,92vw);padding:38px;border:1px solid #354355;border-radius:22px;background:#151d28;box-shadow:0 22px 70px #0007}h1{margin:0 0 8px;font-size:30px}p{color:#aab7c7;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}.choice{padding:22px;text-align:left;background:#202c3b;color:#fff;border:1px solid #3c4c60;border-radius:15px;cursor:pointer}.choice:hover{border-color:#8ba8c8;background:#26364a}.choice strong{display:block;font-size:20px;margin-bottom:8px}.choice span{color:#b7c3d2;line-height:1.4}.foot{font-size:12px;margin-top:22px;color:#8292a5}#msg{margin-top:15px;color:#fca5a5}@media(max-width:520px){.choices{grid-template-columns:1fr}main{padding:24px}}
</style></head><body><main><h1>Computer Swarm</h1><p>Choose how this PC will use Computer Swarm. Your selection is saved for this Windows account and used on future launches.</p><div class="choices"><button class="choice" onclick="choose('operator')"><strong>Operator</strong><span>Open the control dashboard inside this app window and manage authorized Agent PCs.</span></button><button class="choice" onclick="choose('agent')"><strong>Agent</strong><span>Connect this PC to an Operator and view its connection status.</span></button></div><div id="msg" role="status"></div><div class="foot">Choose only on a PC you own or are authorized to administer. Agent autostart is optional and can be disabled from Windows startup settings.</div></main><script>async function choose(role){const m=document.getElementById('msg');m.textContent='Starting…';try{const r=await window.swarmApp.chooseRole(role);if(!r.ok)m.textContent=r.message||'Could not save selection.';}catch(e){m.textContent=e.message;}}</script></body></html>
